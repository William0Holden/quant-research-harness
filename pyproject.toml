[project]
name = "qts"
version = "0.1.0"
description = "NLP + Factor systematic equity research harness (V1)"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "requests>=2.31",
    "python-dateutil>=2.8",
    "scipy>=1.10",
    "streamlit>=1.30",
    "plotly>=5.18",
    "lxml",
    "feedparser>=6.0",
    "trafilatura>=1.8",
    "praw>=7.7",
    "patchright>=1.45",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
live = ["alpaca-py>=0.21"]
ml = ["lightgbm>=4.0", "scikit-learn>=1.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qts"]

[tool.uv]
package = true
